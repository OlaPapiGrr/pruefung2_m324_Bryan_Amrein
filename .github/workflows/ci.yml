name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-format-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Format code
        run: npm run format-check

      - name: Run tests
        run: npm test
  AI Review:
    runs-on: ubuntu-latest
    needs: lint-format-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Dependencies
        run: npm install axios

      - name: AI Code Review
        uses: aidar-freeed/ai-codereviewer@v1.0.0
        with:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          open_ai_model: gpt-3.5-turbo
          with-comment: true
  add-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add hello-world
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            Hello World!
